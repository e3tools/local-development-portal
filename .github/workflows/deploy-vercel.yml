name: Deploy demo to Vercel

# Every merge into developAgentic ships a new production deployment.
#
# Vercel's own Git integration is disabled (github.enabled: false in
# cosomis/vercel.json) so this workflow is the single deploy path; otherwise
# each push would deploy twice and race itself.

on:
  push:
    branches: [developAgentic]
  workflow_dispatch:
    inputs:
      reseed:
        description: >-
          Wipe the Neon database and rebuild the demo dataset. Off by default
          so ordinary merges keep whatever state the demo has accumulated.
        type: boolean
        default: false

# A newer merge supersedes an in-flight deployment rather than racing it.
concurrency:
  group: vercel-developagentic
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  verify:
    name: Migrate, seed and render every page
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cosomis
          POSTGRES_PASSWORD: cosomis
          POSTGRES_DB: cosomis_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: cosomis

    env:
      DATABASE_URL: postgres://cosomis:cosomis@localhost:5432/cosomis_ci
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: 'False'
      ALLOWED_HOSTS: '*'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cosomis/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Plain `check`, not `check --deploy`: the deploy checks currently trip
      # drf-spectacular E001 (the pinned drf-spectacular calls
      # serializers.NullBooleanField, removed in DRF 3.14), which is unrelated
      # to this deployment and only affects the OpenAPI schema endpoint.
      - name: Django system checks
        run: python manage.py check --fail-level ERROR

      - name: Apply migrations
        run: python manage.py migrate --noinput

      # The assistant's scoping rules (what a partner vs. a moderator can see)
      # are enforced in code and covered by unit tests with a fake model client.
      - name: Assistant unit tests
        run: python manage.py test assistant --noinput

      - name: Seed the demo dataset
        run: python manage.py seed_togo_demo --reset

      - name: Render every major page
        run: python manage.py demo_smoke_test

  migrate:
    name: Migrate Neon
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cosomis
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: 'False'
      ALLOWED_HOSTS: '*'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cosomis/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The schema has to be in place before the new code serves traffic.
      - name: Apply migrations to Neon
        run: python manage.py migrate --noinput

      # Only on an explicit manual run: rebuilding the dataset discards any
      # state the demo has accumulated (carts, approvals, uploads).
      - name: Rebuild the demo dataset
        if: github.event_name == 'workflow_dispatch' && inputs.reseed
        run: python manage.py seed_togo_demo --reset

  deploy:
    name: Build and deploy
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: cosomis

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `vercel build` runs the Python builder locally on the runner, and that
      # builder resolves and installs requirements.txt with uv — it aborts
      # with "uv is required but was not found in PATH" otherwise. Python
      # 3.12 matches .python-version.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Shows which account the token belongs to and which teams it can act
      # for. `vercel pull` fails with "Could not retrieve Project Settings"
      # when the token is scoped to an account that cannot see
      # VERCEL_ORG_ID, and this makes that diagnosis immediate.
      - name: Check token scope
        run: |
          vercel whoami --token="${{ secrets.VERCEL_TOKEN }}"
          vercel teams ls --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Demo deployed :rocket:"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
