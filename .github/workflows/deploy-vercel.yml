name: Deploy to Vercel

# Every merge into agentic-LDP ships a new production deployment.
# Vercel's own Git integration is disabled in vercel.json so this workflow is
# the single deploy path — otherwise each push would deploy twice.

on:
  push:
    branches: [agentic-LDP]
  workflow_dispatch:

# Never let two deployments of the same branch race each other; a newer merge
# supersedes an in-flight one.
concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        # `next typegen` writes the generated route helpers (LayoutProps,
        # PageProps, …) that app-router files reference; without it tsc fails on
        # a clean checkout that has never run `next dev`/`next build`.
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Check sample images are in sync with the generator
        run: |
          node scripts/generate-sample-images.mjs
          git diff --exit-code -- public/img \
            || { echo "::error::public/img is out of date — run 'npm run images' and commit the result."; exit 1; }

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
