<!-- Custom javascript -->
<script src="{% static 'js/grm.js' %}"></script>
<script src="{% static 'js/disableOnSubmit.js' %}"></script>
<script>
    document.addEventListener("DOMContentLoaded", function(){
        document.querySelectorAll('.sidebar .nav-link').forEach(function(element){
            
            element.addEventListener('click', function (e) {

            let nextEl = element.nextElementSibling;
            let parentEl  = element.parentElement;	

                if(nextEl) {
                    e.preventDefault();	
                    let mycollapse = new bootstrap.Collapse(nextEl);
                    
                    if(nextEl.classList.contains('show')){
                    mycollapse.hide();
                    } else {
                        mycollapse.show();
                        // find other submenus with class=show
                        var opened_submenu = parentEl.parentElement.querySelector('.submenu.show');
                        // if it exists, then close all of them
                        if(opened_submenu){
                        new bootstrap.Collapse(opened_submenu);
                        }
                    }
                }
            }); // addEventListener
        }) // forEach
    }); 
    // DOMContentLoaded  end
</script>


<script src="{% static 'js/notifications.js' %}"></script>
<script src="{% static 'js/htmx.min.js' %}"></script>
<script type="text/javascript">
    {% if user.is_authenticated and user.password_changed_once == False %}
        pushNotify("{% translate 'Veuillez aller changer votre mot de passe dans la session Utilisateur.' %}", "error");
    {% endif %}
</script>
